<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorem Terminal</title>
  <meta name="description" content="A markdown-driven site with animated monospace type and ASCII art.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply saved preferences before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.dataset.theme = t;
      if (localStorage.getItem('motion') === 'off') document.documentElement.dataset.motion = 'off';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="logo" href="?p=home" data-scramble>LOREM.SYS</a>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="controls">
      <button type="button" id="toggle-motion" class="ctl" aria-pressed="true" title="Toggle animations">ANIM:ON</button>
      <button type="button" id="toggle-theme" class="ctl" title="Toggle light / dark">THEME</button>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>

  <main id="main" class="page">
    <pre class="boot" id="boot" aria-hidden="true"></pre>
    <header class="page-head" id="page-head"></header>
    <nav class="toc" id="toc" aria-label="Contents" hidden></nav>
    <article class="prose" id="article"></article>
    <footer class="eof" id="eof"></footer>
  </main>

  <script src="assets/vendor/marked.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
