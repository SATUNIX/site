# Weekly, grouped dependency updates. Security updates are raised immediately regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-tooling:
        patterns: ["*"]
        exclude-patterns: ["astro", "@astrojs/*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
